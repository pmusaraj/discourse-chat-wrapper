<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Discourse Chat Wrapper</title>
  <style>
    :root {
      color-scheme:light dark;
      font-family:-apple-system, system-ui, sans-serif;
      --background:#f7f5f1;
      --surface:#fff;
      --text:#17212f;
      --muted:#626873;
      --border:#e7e8eb;
      --site-background:#f0f6ff;
      --site-border:#cfe0fb;
      --accent:#2475ed;
      --accent-hover:#155fcb;
      --success:#26944b;
      --shadow:0 16px 48px -16px #473c2926, 0 2px 8px #473c2905;
    }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; padding:64px 24px 32px; display:grid; place-items:center; background:var(--background); color:var(--text); }
    header { position:fixed; inset:0 0 auto; height:40px; display:grid; place-items:center; user-select:none; font-size:12px; color:var(--muted); background:var(--background); z-index:1; }
    main { width:min(560px, 100%); padding:40px; border:1px solid color-mix(in srgb, var(--border) 45%, transparent); border-radius:24px; background:var(--surface); box-shadow:var(--shadow); }
    h1 { font-size:28px; font-weight:650; line-height:1.2; letter-spacing:-.8px; margin:0; }
    h2 { font-size:16px; font-weight:650; margin:0 0 12px; }
    p { line-height:1.55; color:var(--muted); }
    #intro { margin:24px 0 32px; }
    label { display:block; font-size:14px; font-weight:600; margin:24px 0 8px; }
    input, textarea { width:100%; font:inherit; padding:12px 14px; border:1px solid var(--border); border-radius:10px; background:var(--surface); color:var(--text); }
    textarea { resize:vertical; }
    button { font:inherit; padding:10px 16px; border-radius:10px; border:1px solid var(--border); background:var(--surface); color:var(--text); cursor:pointer; }
    button:hover:not(:disabled) { background:var(--background); }
    button:disabled { opacity:.45; cursor:wait; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline:3px solid color-mix(in srgb, var(--accent) 65%, transparent); outline-offset:3px; }
    #connect, #submit-code { background:var(--accent); color:white; border-color:transparent; font-weight:600; }
    #connect { margin-top:16px; width:100%; }
    #connect:hover:not(:disabled), #submit-code:hover:not(:disabled), .open-site:hover:not(:disabled) { background:var(--accent-hover); }
    #status { margin:20px 0 0; font-size:14px; }
    #status:empty { display:none; }
    #retry { margin-top:12px; }
    #session-list { display:grid; gap:12px; }
    .session { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:14px; border:1px solid var(--site-border); border-radius:14px; background:var(--site-background); }
    .session small { display:flex; align-items:center; gap:7px; color:var(--muted); font-size:13px; font-weight:400; margin-top:5px; }
    .session small::before { content:""; width:8px; height:8px; flex:none; border-radius:50%; background:var(--muted); opacity:.5; }
    .session small.is-active::before { background:var(--success); opacity:1; }
    .brand { display:flex; align-items:center; gap:16px; }
    .logo { width:52px; height:52px; flex:none; display:block; }
    .session-identity { display:flex; align-items:center; gap:14px; min-width:0; }
    .site-logo { width:48px; height:48px; padding:6px; object-fit:contain; flex:none; border:1px solid var(--border); border-radius:12px; background:var(--surface); box-shadow:0 2px 5px #17212f05; }
    .session-label { min-width:0; font-weight:550; overflow-wrap:anywhere; }
    .open-site { display:grid; place-items:center; width:40px; height:40px; flex:none; padding:0; border:0; border-radius:50%; background:var(--accent); color:white; }
    .open-site svg { width:21px; height:21px; }
    .open-site:disabled { cursor:default; }
    details.collapsible { margin-top:28px; padding-top:16px; border-top:1px solid var(--border); }
    summary { cursor:pointer; font-weight:600; padding:8px 0; }
    summary::marker { font-size:.8em; }
    details:not(.collapsible) > summary { display:none; }
    .hint { font-size:13px; }
    #device-code { padding:14px; border:1px solid var(--site-border); border-radius:10px; background:var(--site-background); color:var(--text); }
    @media (prefers-color-scheme:dark) {
      :root { --background:#1b1a18; --surface:#272624; --text:#f2f1ee; --muted:#b8b6b2; --border:#44423f; --site-background:#263346; --site-border:#3d5577; --accent:#307df0; --accent-hover:#428af5; --success:#65c884; --shadow:0 16px 48px -16px #0008; }
    }
    @media (max-width:480px) {
      body { padding:56px 16px 24px; }
      main { padding:24px; border-radius:20px; }
      h1 { font-size:24px; letter-spacing:-.6px; }
      .brand { gap:12px; }
      .logo { width:44px; height:44px; }
      .session { gap:10px; padding:12px; }
      .session-identity { gap:10px; }
      .site-logo { width:40px; height:40px; }
    }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
  <header data-tiny-drag>Discourse Chat Wrapper</header>
  <main>
    <div class="brand">
      <img class="logo" src="logo.svg" alt="" width="48" height="48">
      <h1 id="heading">Chat on Discourse</h1>
    </div>
    <p id="intro">Use Discourse Chat in this dedicated window. Supports multiple communities.</p>
    <section id="sessions" aria-label="Saved sessions">
      <h2>Your sites</h2>
      <div id="session-list"></div>
    </section>
    <details id="add-site" open>
      <summary>Add a new chat site</summary>
    <form id="picker">
      <label for="address">Discourse site address</label>
      <input id="address" type="text" inputmode="url" placeholder="community.example.com" autocomplete="url" autocapitalize="none" spellcheck="false" required>
      <button id="connect" type="submit">Authenticate</button>
      <button id="cancel-login" type="button" hidden style="margin-top:12px">Cancel</button>
      <p class="hint">Use the site’s main HTTPS address. One site is open at a time.</p>

    </form>
    <section id="device-login" hidden>
      <p>Enter this code in your browser to approve sign-in:</p>
      <p id="device-code" style="font: bold 24px monospace;user-select:all"></p>
    </section>
    <form id="paste-login" hidden>
      <label for="authorization-code">Authorization code from your browser</label>
      <textarea id="authorization-code" rows="3" autocomplete="off" autocapitalize="none" spellcheck="false" required></textarea>
      <button id="submit-code" type="submit" style="margin-top:12px">Continue to chat</button>
    </form>
    </details>
    <p id="status" role="status" aria-live="polite">Loading your preferences…</p>
    <button id="retry" hidden>Retry</button>
  </main>
  <script src="picker.js"></script>
</body>
</html>
